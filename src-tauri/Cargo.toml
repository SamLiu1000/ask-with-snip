[package]
name = "ask-with-snip"
version = "0.1.0"
description = "随时随地框选屏幕并提问的 AI 视觉助手"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ask_with_snip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 诊断用的探针窗口，只在显式开 feature 时才构建，正常的 cargo build / tauri build
# 完全不带上它（否则包里会多一个 bin，打包那步会挑不出来该用哪个）。
[features]
probe = []

[[bin]]
name = "webchat_probe"
path = "src/bin/webchat_probe.rs"
required-features = ["probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
# 单实例防呆：重复启动时第二个进程立刻退出，并唤醒已运行的实例
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3.34"
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "socks"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
xcap = "0.9.8"
arboard = "3"
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
